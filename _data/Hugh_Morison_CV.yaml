design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 2cm
    bottom_margin: 1.5cm
    left_margin: 2cm
    right_margin: 2cm
    show_footer: false
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: XCharter
      name: XCharter
      connections: XCharter
      headline: XCharter
      section_titles: XCharter
    font_size:
      body: 10pt
      name: 20pt
      section_titles: 11pt
    small_caps:
      section_titles: false
    bold:
      name: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: left
    photo_width: 3.5cm
    space_below_name: 0.25cm
    space_below_headline: 0.3cm
    space_below_connections: 0.5cm
    connections:
      phone_number_format: national
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.3cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.42cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.3cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0cm
    space_between_columns: 0.1cm
    allow_page_break: true
    short_second_row: false
    degree_width: 1cm
    summary:
      space_left: 0cm
    highlights:
      bullet: •
      space_left: 0.4cm
      space_above: 0.25cm
      space_between_items: 0.14cm
      space_between_bullet_and_text: 0.3em
  templates:
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME**
        *SUMMARY*
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY -- LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        AUTHORS
        SUMMARY
        URL (JOURNAL)
      date_and_location_column: DATE
locale:
  language: english
settings:
  current_date: today
  render_command:
    output_folder: ../rendercv_output
  bold_keywords: []
  pdf_title: NAME - CV
