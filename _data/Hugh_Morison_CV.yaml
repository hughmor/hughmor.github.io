    projects:
      - name: '[fairchild](https://github.com/hughmor/fairchild)'
        summary: Open-source electronic-photonic circuit simulator, in development
        start_date: 2026-05
        end_date: present
        highlights:
          - "Modified nodal analysis engine in Rust that solves optical fields and electrical unknowns in the same Newton iteration, removing the fixed-point loop between separate photonic and electronic tools."
          - "Runs Verilog-A device models compiled to OSDI with transient noise, so a full link simulates from laser to transimpedance amplifier in one deck."
    skills:
      - label: Photonic Integrated Circuits
        details: "Foundry tapeout on AMF silicon photonics, GlobalFoundries 45SPCLO monolithic CMOS-photonics, and thin-film lithium niobate; microring modulators and weight banks; layout, floorplanning, waveguide routing, DRC/LVS"
      - label: Electronics
        details: "Analog mixed-signal design (TIA, comparator, DAC, closed-loop control), digital logic in a custom design flow, RF & mixed-signal PCB design, FPGA/RFSoC data acquisition"
      - label: Modelling & Simulation
        details: "System-level electronic-photonic co-simulation, Verilog-A device models, FDTD & photonic circuit simulation, Bayesian inference & system identification, nonlinear dynamics"
      - label: Test & Measurement
        details: "Fibre-coupled PIC characterisation, optical spectrum analysers, high-speed oscilloscopes & arbitrary waveform generators, automated measurement in Python, wirebonding, packaging, UV lithography"
      - label: EDA & Tools
        details: "Synopsys OptoCompiler & PrimeSim, Cadence Virtuoso, KLayout, Ansys Lumerical, LTspice, KiCAD, Vivado, Git, Linux, LaTeX"
      - label: Programming
        details: "Python (NumPy/SciPy), C, C++, MATLAB, Verilog & Verilog-A"
