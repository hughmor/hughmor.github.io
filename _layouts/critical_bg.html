---
layout: default
---

<!-- full-screen background canvas (beneath content) -->
<style>
  /* background layer */
  #bg-sim-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none; /* clicks go to content */
  }
  /* ensure content reads well over busy bg */
  .post-bg-sim .content-wrap {
    position: relative;
    isolation: isolate;
  }
  /* optional: subtle backdrop for readability */
  .post-bg-sim .content-wrap .prose {
    backdrop-filter: blur(2px) saturate(1.05);
  }
  /* honor reduced motion */
  @media (prefers-reduced-motion: reduce) {
    #bg-sim-canvas { display: none; }
  }



/* 0) tuneables */
:root {
  --card-alpha: .65;          /* opacity of the content bg */
  --card-blur: 8px;           /* blur applied behind the content */
  --card-radius: 16px;
  --card-shadow: 0 6px 30px rgba(0,0,0,.20);

  --bg-blur: 0.5px;           /* global softness on the canvas */
  --bg-sat: 0.9;
  --bg-ctr: 0.95;
}

/* 1) soften the *canvas* so motion feels calmer */
#bg-sim-canvas {
  filter: blur(var(--bg-blur)) saturate(var(--bg-sat)) contrast(var(--bg-ctr));
  transform: translateZ(0); /* prevent filter jank */
  will-change: filter;
}

/* optional vignette overlay to reduce edge contrast */
#bg-sim-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1; /* above canvas, below content */
  background:
    radial-gradient(80% 60% at 50% 40%,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.08) 70%,
      rgba(0,0,0,.18) 100%);
}

/* 2) translucent, blurred content plane */
.post-bg-sim .content-wrap {
  position: relative;
  isolation: isolate; /* prevents backdrop from bleeding across stacking contexts */
  margin: 0 auto;
  padding: clamp(1rem, 3vw, 2rem);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);

  /* background w/ alpha from your theme var (fallback provided) */
  background: color(from var(--bg) srgb r g b / var(--card-alpha));
  /* fallback if color() not supported */
  background: rgba(255,255,255,var(--card-alpha));

  /* blur *behind* the element (not the text) */
  backdrop-filter: blur(var(--card-blur)) saturate(1.05);
  -webkit-backdrop-filter: blur(var(--card-blur)) saturate(1.05);

  /* subtle border that adapts to theme */
  border: 1px solid color-mix(in oklab, var(--bg) 60%, transparent);
}

/* better legibility for prose inside */
.post-bg-sim .content-wrap .prose {
  color: var(--txt);
}

/* accessibility: reduce motion/transparency if requested */
@media (prefers-reduced-motion: reduce) {
  #bg-sim-canvas { filter: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .post-bg-sim .content-wrap {
    backdrop-filter: none; -webkit-backdrop-filter: none;
    background: var(--bg);
  }
}
/* graceful fallback if backdrop-filter is unsupported */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .post-bg-sim .content-wrap {
    background: color(from var(--bg) srgb r g b / .92);
    background: rgba(255,255,255,.92);
  }
}
</style>

<canvas id="bg-sim-canvas"></canvas>

<div id="bg-sim-overlay"></div>
<div class="post-bg-sim">
  <div class="content-wrap">
    {{ content }}
  </div>
</div>

<!-- module script; update path as you place the file -->
<script type="module">
  import { startSim, setScrollParam, stopSim } from "{{ '/assets/js/ising.js' | relative_url }}";

  // boot the sim once DOM is ready
  const canvas = document.getElementById('bg-sim-canvas');
  const ctrl = startSim(canvas, {
    // initial params; you’ll feed 'temperature' from scroll
    temperature: 2.269, // critical-ish for 2D ising (J/kB units); placeholder
    fpsCap: 60,
    scale: 2, // display upscaling factor (simulation grid will be smaller)
  });

  // map scroll progress [0,1] → parameter (ease, clamp, etc.)
  function getScrollProgress() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    return Math.min(1, Math.max(0, window.scrollY / max));
  }
  function easeInOutQuad(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }

  function onScroll() {
    const p = easeInOutQuad(getScrollProgress());
    // map progress to temp range you like; example: [Tc-0.6, Tc+0.6]
    const Tc = 2.269;
    const T = Tc - 0.6 + p * (1.2);
    setScrollParam('temperature', T);
  }

  // attach listeners
  document.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => ctrl.resize());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopSim(); else startSim(canvas);
  });

  // initial sync
  onScroll();
</script>
