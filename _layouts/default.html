<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}">
  </head>

    href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <script defer
    src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>

  <script>
    window.MathJax = {tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }};
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  <script src="{{ '/assets/p5/p5.min.js' | relative_url }}"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@v0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.180.0/examples/jsm/"
    }
  }
  </script>
  <body>
    <main>
        <button id="theme-toggle" aria-label="toggle theme" aria-pressed="false">toggle theme</button>
        <p class="home-link">
            <a href="{{ '/' | relative_url }}">home</a>
        </p>
        <h1>{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%B %Y" }}</p>
        {{ content }}
    </main>
    <footer>
        <p>© {{ site.time | date: "%Y" }} hughmor</p>
    </footer>
    <script>
    (() => {
      const root = document.documentElement;
      const KEY = 'theme'; // 'light' | 'dark'
      const btn = document.getElementById('theme-toggle');

      // 1) initialize from localStorage or OS
      const saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark') {
        root.dataset.theme = saved;
      } else {
        // no override: let media query pick default (do nothing)
      }

      // keep aria state in sync
      const syncAria = () => {
        const t = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (btn) btn.setAttribute('aria-pressed', String(t === 'dark'));
      };
      syncAria();

      // 2) toggle handler
      btn?.addEventListener('click', () => {
        const current = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem(KEY, next);
        syncAria();

        // optional: set browser ui color on mobile
        const meta = document.querySelector('meta[name="theme-color"]') || (() => {
          const m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); return m;
        })();
        const styles = getComputedStyle(root);
        meta.content = styles.getPropertyValue('--bg').trim();
      });

      // 3) if user changes os theme and there’s NO manual override, adapt live
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem(KEY)) {
          delete root.dataset.theme;
          syncAria();
        }
      });
    })();
    </script>
  </body>
</html>
